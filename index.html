    <script>
        function getJSTNow() { const now = new Date(); return new Date(now.getTime() + 9 * 60 * 60 * 1000); }
        function parseJSTDate(dateString) {
            if (!dateString || typeof dateString !== 'string') return null;
            const cleanDateString = dateString.trim();
            if (!cleanDateString) return null;
            const normalizedDate = cleanDateString.replace(/[年\-.]/g, '/').replace(/月/g, '/').replace(/日/g, '').replace(/\s+/g, '');
            const parts = normalizedDate.split('/');
            if (parts.length < 2 || parts.length > 3) return null;
            const year = parseInt(parts[0], 10), month = parseInt(parts[1], 10), day = parts[2] ? parseInt(parts[2], 10) : 1;
            if (isNaN(year) || isNaN(month) || isNaN(day)) return null;
            if (month < 1 || month > 12) return null;
            if (day < 1 || day > 31) return null;
            return createJSTDate(year, month - 1, day);
        }
        function formatJSTDate(date) {
            if (!date || !(date instanceof Date) || isNaN(date.getTime())) return '';
            return `${date.getUTCFullYear()}/${String(date.getUTCMonth() + 1).padStart(2, '0')}/${String(date.getUTCDate()).padStart(2, '0')}`;
        }
        function formatJSTDateJapanese(date) {
            if (!date || !(date instanceof Date) || isNaN(date.getTime())) return '';
            return `${date.getUTCFullYear()}年${date.getUTCMonth() + 1}月${date.getUTCDate()}日`;
        }
        function formatJSTDateTimeJapanese(date) {
            if (!date || !(date instanceof Date) || isNaN(date.getTime())) return '';
            return `${date.getUTCFullYear()}年${date.getUTCMonth() + 1}月${date.getUTCDate()}日 ${String(date.getUTCHours()).padStart(2, '0')}:${String(date.getUTCMinutes()).padStart(2, '0')}`;
        }
        function getJSTMidnight() { const now = getJSTNow(); return createJSTDate(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate()); }
        function getMillisecondsUntilJSTMidnight() { const now = getJSTNow(); const m = getJSTMidnight(); m.setUTCDate(m.getUTCDate() + 1); return m.getTime() - now.getTime(); }
        function getJSTYear() { return getJSTNow().getUTCFullYear(); }
        function getJSTMonth() { return getJSTNow().getUTCMonth(); }
        function getJSTDate() { return getJSTNow().getUTCDate(); }
        function getJSTHours() { return getJSTNow().getUTCHours(); }
        function getJSTMinutes() { return getJSTNow().getUTCMinutes(); }
        function getJSTSeconds() { return getJSTNow().getUTCSeconds(); }
        function createJSTDate(year, month, day, hour = 0, minute = 0, second = 0) { return new Date(Date.UTC(year, month, day, hour, minute, second)); }
        function isSameJSTDay(date1, date2) {
            if (!date1 || !date2) return false;
            return date1.getUTCFullYear() === date2.getUTCFullYear() && date1.getUTCMonth() === date2.getUTCMonth() && date1.getUTCDate() === date2.getUTCDate();
        }
        function isJSTToday(date) { return isSameJSTDay(date, getJSTNow()); }
        function getJSTDaysDifference(date1, date2) {
            const m1 = createJSTDate(date1.getUTCFullYear(), date1.getUTCMonth(), date1.getUTCDate());
            const m2 = createJSTDate(date2.getUTCFullYear(), date2.getUTCMonth(), date2.getUTCDate());
            return Math.floor((m2.getTime() - m1.getTime()) / (1000 * 60 * 60 * 24));
        }
        function formatDate(date) { return formatJSTDate(date); }
        function toJST(date) { if (!date || !(date instanceof Date) || isNaN(date.getTime())) return new Date(NaN); return new Date(date.getTime()); }
        function getJSTNowString() {
            const now = getJSTNow();
            return `${now.getUTCFullYear()}-${String(now.getUTCMonth() + 1).padStart(2, '0')}-${String(now.getUTCDate()).padStart(2, '0')} ${String(now.getUTCHours()).padStart(2, '0')}:${String(now.getUTCMinutes()).padStart(2, '0')}:${String(now.getUTCSeconds()).padStart(2, '0')} JST`;
        }

    <style>

            --ink-soft: rgba(38, 36, 31, .72);
            --ink-faint: rgba(38, 36, 31, .48);

            --line-strong: rgba(38, 36, 31, .38);

            --teal-line: rgba(23, 94, 99, .42);
            --on-teal: #F2F0EA;
            --amber: #9A6B00;

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            -webkit-text-size-adjust: 100%;
            scrollbar-width: thin;
            scrollbar-color: var(--line-strong) transparent;
        }

        body {
            font-family: var(--font);
            font-size: 14px;
            line-height: 1.7;
            color: var(--ink);
            background: var(--paper);
            padding-top: calc(var(--nav-h) + 26px);
            min-height: 100vh;
            overflow-x: hidden;
            transition: background-color .35s var(--ease), color .35s var(--ease);
        }

        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--line-strong);
            border-radius: 8px;
            border: 3px solid var(--paper);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--teal-line);
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -2;
            pointer-events: none;
            background-image: linear-gradient(var(--grid-line) 1px, transparent 1px), linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 34px 34px;
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            opacity: var(--grain-op);
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
        }

        .fog {
            position: fixed;
            inset: -15%;
            z-index: -3;
            pointer-events: none;
            filter: blur(90px);
        }

        .fog span {
            position: absolute;
            border-radius: 50%;
        }

        .fog-a {
            width: 58vw;
            height: 58vw;
            top: -8%;
            left: -6%;
            background: radial-gradient(circle, var(--fog-a), transparent 70%);
            animation: drift-a 70s var(--ease) infinite alternate;
        }

        .fog-b {
            width: 48vw;
            height: 48vw;
            bottom: -12%;
            right: -6%;
            background: radial-gradient(circle, var(--fog-b), transparent 70%);
            animation: drift-b 95s var(--ease) infinite alternate;
        }

        @keyframes drift-a {
            from {
                transform: translate(-4%, -2%) scale(1);
            }

            to {
                transform: translate(5%, 4%) scale(1.08);
            }
        }

        @keyframes drift-b {

        }

        }

        /* ---------- Carousel ---------- */
        .c-carousel {
            padding: 22px 18px 18px;
            overflow: hidden;
            position: relative;
        }

        .carousel {
            position: relative;
            width: 100%;
        }

        .carousel-track-wrap {
            overflow: hidden;
            width: 100%;
            border-radius: 14px;
        }

        .carousel-track {
            display: flex;
            gap: 14px;
            transition: transform .45s var(--ease);
            will-change: transform;
        }

        .carousel-slide {
            flex: 0 0 calc((100% - 28px) / 3);
            aspect-ratio: 4 / 3;
            background: var(--card-2);
            border: 1px solid var(--line);
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: transform .22s var(--ease), border-color .22s var(--ease), box-shadow .22s var(--ease);
            box-sizing: border-box;
            min-width: 0;
        }

        .carousel-slide:hover {
            transform: translateY(-2px);
            border-color: var(--teal-line);
            box-shadow: var(--shadow-lift);
        }

        @media (max-width: 960px) {
            .carousel-slide {
                flex: 0 0 calc((100% - 14px) / 2);
            }
        }

        @media (max-width: 600px) {
            .carousel-slide {
                flex: 0 0 100%;
            }
        }

        .carousel-media-wrap {
            width: 100%;
            flex: 1;
            min-height: 0;
            background: #000;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;

            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

            height: 100%;

            font-size: 12px;
            font-weight: 500;
            letter-spacing: .04em;
            transition: color .2s var(--ease), border-color .2s var(--ease), transform .2s var(--ease);
        }

        .cal-nav button:hover {
            color: var(--teal);
            border-color: var(--teal-line);
            transform: translateY(-1px);
        }

        .cal-nav .cal-step {
            width: 36px;
            padding: 0;
            display: grid;
            place-items: center;
            font-size: 11px;
        }

        .cal-week {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 8px;
            align-items: stretch;
        }

        .cal-day {
            border: 1px solid var(--line);
            border-radius: 12px;
            background: var(--card-2);
            padding: 10px;
            min-height: 168px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: border-color .25s var(--ease), box-shadow .25s var(--ease), background-color .25s var(--ease);
        }

        .cal-day.is-today {
            border-color: var(--teal-line);
            box-shadow: inset 0 0 0 1px var(--teal-line);
        }

        .cal-day.is-selected {
            background: var(--teal-tint);
            border-color: var(--teal);
        }

        .cal-day-head {
            height: 90px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 2px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--line);
            border-radius: 8px 8px 0 0;
            cursor: pointer;
            transition: background-color .2s var(--ease);
        }

        .cal-day-head:hover {
            background: color-mix(in srgb, var(--ink) 6%, transparent);
        }

        .cal-weekday {
            font-size: 10px;
            letter-spacing: .12em;
            color: var(--ink-faint);
        }

        .cal-datenum {
            font-size: 21px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            line-height: 1.1;
        }

        .cal-day.is-today .cal-datenum,
        .cal-day.is-selected .cal-datenum {
            color: var(--teal);
        }

        .cal-monthlabel {
            font-size: 9px;
            color: var(--ink-faint);
            letter-spacing: .08em;
        }

        .cal-holiday {
            font-size: 8.5px;
            color: var(--amber);
            line-height: 1.3;
            text-align: center;
            max-width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .cal-events {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .cal-event {
            font-size: 10.5px;
            line-height: 1.4;
            padding: 5px 7px;
            border-radius: 7px;
            color: #fff;
            text-decoration: none;
            display: block;
            overflow-wrap: anywhere;
            transition: transform .18s var(--ease), filter .18s var(--ease);
        }

        .cal-event.is-clickable {
            cursor: pointer;
        }

        .cal-event.is-clickable:hover {
            transform: translateY(-1px);
            filter: brightness(1.08);
        }

        /* ---------- Heatmap (contribution graph) ---------- */
        .heat-scroll {
            margin-top: 18px;
            padding-top: 18px;
            border-top: 1px solid var(--line);
            overflow-x: auto;
            max-width: 100%;
            min-width: 0;
            padding-bottom: 6px;
            scrollbar-width: thin;
            scrollbar-color: var(--line-strong) transparent;
            -webkit-overflow-scrolling: touch;
        }

        .heat {
            display: grid;
            grid-template-columns: auto 1fr;
            column-gap: 10px;
            min-width: 780px;
            width: 100%;
        }

        .heat-side {
            padding-top: 22px;
            display: grid;
            grid-template-rows: repeat(7, 1fr);
            gap: 4px;
        }

        .heat-wd {
            font-size: 10px;
            color: var(--ink-faint);
            display: grid;
            place-items: center;
            line-height: 1;
        }

        .heat-months {
            display: grid;
            height: 16px;
            margin-bottom: 6px;
        }

        .heat-month {
            font-size: 10px;
            color: var(--ink-faint);
            font-variant-numeric: tabular-nums;
            justify-self: start;
            line-height: 16px;
            white-space: nowrap;
        }

        .heat-grid {
            display: grid;
            grid-template-rows: repeat(7, auto);
            grid-auto-flow: column;
            gap: 4px;
        }

        .heat-cell {
            aspect-ratio: 1;
            border-radius: 4px;
            background: color-mix(in srgb, var(--ink) 7%, transparent);
            box-shadow: inset 0 0 0 1px var(--line);
            display: grid;
            place-items: center;
            font-size: clamp(8px, 1.05vw, 15px);
            line-height: 1;
            text-decoration: none;
        }

        .heat-cell.is-out {
            visibility: hidden;
        }

        .heat-cell.is-active {
            background: var(--heat);
            box-shadow: none;
            cursor: pointer;
            transition: transform .18s var(--ease), filter .18s var(--ease);
        }

        .heat-cell.is-active.is-bio {
            background: var(--viz-blue);
        }

        .heat-cell.is-active:hover {
            transform: scale(1.18);
            filter: brightness(1.08);
            position: relative;
            z-index: 1;
        }

        .heat-emoji {
            pointer-events: none;
            font-size: 0.8em;
        }

        /* ---------- Content area ---------- */
        .bento {
            display: grid;
            grid-template-columns: repeat(12, minmax(0, 1fr));
            gap: 14px;
            align-items: start;
        }

        .left-col {
            grid-column: span 3;
            position: sticky;
            top: calc(var(--nav-h) + 16px);
            align-self: start;
            display: grid;
            gap: 14px;
        }

        .c-filter {
            animation-delay: .02s;
        }

        .c-chart {
            animation-delay: .08s;
        }

        .c-timeline {
            grid-column: span 9;
            padding: 22px 22px 8px;
            animation-delay: .14s;
        }

        .chart-rows {
            display: grid;
            grid-template-columns: 1fr;
            gap: 11px;
        }

        .chart-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chart-row[data-type="映画"] {
            border-top: 1px solid var(--line);
            padding-top: 13px;
            margin-top: 2px;
        }

        .chart-label {
            font-size: 10.5px;
            letter-spacing: .05em;
            color: var(--ink-soft);
            width: 74px;
            flex-shrink: 0;
        }

        .chart-row--stat .chart-label {
            color: var(--ink);
            font-weight: 600;
        }

        .chart-track {
            flex: 1;
            height: 10px;
            border-radius: 5px;
            background: var(--card-2);
            border: 1px solid var(--line);
            overflow: hidden;
        }

        .chart-row--stat .chart-track {
            height: 12px;
        }

        .chart-fill {
            display: block;
            height: 100%;
            width: 0;
            border-radius: 5px;
            background: var(--c);
            transition: width .5s var(--ease);
        }

        .chart-num {
            font-size: 12px;
            font-weight: 500;
            width: 3ch;
            text-align: right;
            color: var(--ink);
        }

        .chart-row--stat .chart-num {
            font-size: 14px;
            font-weight: 700;
        }

        .chart-decade-section {
            margin-top: 16px;
            padding-top: 14px;
            border-top: 1px solid var(--line);
        }

        .chart-decade-title {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: .08em;
            color: var(--ink-soft);
            margin-bottom: 10px;
        }

        .chart-decade-rows {
            display: grid;
            grid-template-columns: 1fr;
            gap: 11px;
        }

        .filter-buttons {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
        }

        .filter-btn {
            font-family: var(--font);
            font-variant-numeric: tabular-nums;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: .04em;
            height: 40px;
            padding: 0 6px;
            display: grid;
            place-items: center;
            border-radius: 10px;
            border: 1px solid var(--line);
            background: var(--card-2);
            color: var(--ink-soft);
            white-space: nowrap;
            transition: color .2s var(--ease), background-color .2s var(--ease), border-color .2s var(--ease), transform .2s var(--ease);
        }

        .filter-btn:hover {
            color: var(--ink);
            border-color: var(--line-strong);
            transform: translateY(-1px);
        }

        .filter-btn:active {
            transform: translateY(0) scale(.98);
        }

        .filter-btn.active {
            background: var(--teal);
            border-color: var(--teal);
            color: var(--on-teal);
        }

        .filter-btn[data-filter="all"] {
            grid-column: 1 / -1;
        }

        .switch-row {
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid var(--line);
            display: grid;
            gap: 8px;
        }

        .filter-buttons--two {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .switch-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .switch-label {
            font-size: 12.5px;
            color: var(--ink-soft);
            cursor: pointer;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 46px;
            height: 26px;
            flex-shrink: 0;
            cursor: pointer;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background: var(--card-2);
            border: 1px solid var(--line-strong);
            border-radius: 999px;
            transition: background-color .25s var(--ease), border-color .25s var(--ease);
        }

        .slider::before {
            content: "";
            position: absolute;
            width: 18px;
            height: 18px;
            left: 3px;
            top: 3px;
            border-radius: 50%;
            background: var(--ink-soft);
            transition: transform .25s var(--ease), background-color .25s var(--ease);
        }

        .switch input:checked+.slider {
            background: var(--teal);
            border-color: var(--teal);
        }

        .switch input:checked+.slider::before {
            transform: translateX(20px);
            background: var(--on-teal);
        }

        .switch input:focus-visible+.slider {
            outline: 2px solid var(--teal);
            outline-offset: 2px;
        }

        .timeline-year {
            padding: 18px 0;
        }

        .year-head {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 14px;
        }

        .year-label {
            font-family: var(--font);
            font-variant-numeric: tabular-nums;
            font-weight: 700;
            font-size: 24px;
            letter-spacing: .04em;
            line-height: 1;
            color: var(--ink);
        }

        .year-now .year-label {
            color: var(--teal);
        }

        .year-rule {
            flex: 1;
            border-top: 1px solid var(--line);
        }

        .timeline-items {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
        }

        .timeline-item {
            position: relative;
            background: var(--card-2);
            border: 1px solid var(--line);
            border-radius: 13px;
            padding: 14px;
            cursor: pointer;
            display: grid;
            aspect-ratio: 2 / 3;
            overflow: hidden;
            animation: rise .45s var(--ease) both;
            transition: transform .22s var(--ease), border-color .22s var(--ease), box-shadow .22s var(--ease), background-color .35s var(--ease);
        }

        .timeline-item.has-poster {
            padding: 0;
            background: var(--card-2);
        }

        .work-poster {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border-radius: inherit;
        }

        .timeline-item:hover {
            transform: translateY(-2px);
            border-color: var(--teal-line);
            box-shadow: var(--shadow-lift);
        }

        .timeline-item.lead-role {
            border-color: var(--line-strong);
            background: color-mix(in srgb, var(--card-2) 60%, var(--card));
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(9px);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        .tile-center {
            grid-area: 1 / 1;
            align-self: center;
            justify-self: center;
            text-align: center;
            max-width: 100%;
            min-width: 0;
        }

        .work-title {
            font-family: var(--font);
            font-weight: 600;
            font-size: 15px;
            line-height: 1.5;
            letter-spacing: .02em;
            overflow-wrap: anywhere;
        }

        .tile-sub {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            flex-wrap: wrap;
            margin-top: 6px;
        }

        .work-name {
            font-size: 11px;
            color: var(--ink-soft);
        }

        .badge {
            font-family: var(--font);
            font-size: 9px;
            letter-spacing: .1em;
            padding: 2.5px 7px;
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .badge i {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: block;
        }

        .badge-soon {
            color: var(--amber);
            background: var(--amber-tint);
        }

        .badge-soon i {
            background: var(--amber);
        }

        .badge-live {
            color: var(--teal);
            background: var(--teal-tint);
        }

        .badge-live i {
            background: var(--teal);
            animation: pulse 2.4s var(--ease) infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: .4;
            }
        }

        .tile-meta {
            grid-area: 1 / 1;
            align-self: end;
            justify-self: stretch;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .chip {
            font-family: var(--font);
            font-variant-numeric: tabular-nums;
            font-size: 9px;
            letter-spacing: .1em;
            padding: 2.5px 7px;
            border-radius: 6px;
            border: 1px solid var(--line);
            color: var(--ink-soft);
            white-space: nowrap;
        }

        .chip-lead {
            background: var(--ink);
            color: var(--paper);
            border-color: var(--ink);
            font-weight: 500;
        }

        .tile-date {
            font-size: 10px;
            color: var(--ink-faint);
            letter-spacing: .04em;
        }

        .skeleton-label,
        .skeleton-content {
            background: linear-gradient(90deg, var(--card-2) 25%, var(--line) 50%, var(--card-2) 75%);
            background-size: 200% 100%;
            animation: skeleton-loading 1.6s var(--ease) infinite;
            border-radius: 8px;
            color: transparent !important;
        }

        .skeleton-content {
            height: 100%;
        }

        .skeleton-item {
            cursor: default;
            animation: none;
        }

        .skeleton-item:hover {
            transform: none;
            border-color: var(--line);
            box-shadow: none;
        }

        @keyframes skeleton-loading {
            from {
                background-position: 200% 0;
            }

            to {
                background-position: -200% 0;
            }
        }

        .load-error {
            padding: 22px 4px;
            font-size: 12px;
            color: var(--amber);
            line-height: 2;
        }

        .footer {
            max-width: 1600px;
            margin: 26px auto 0;
            padding: 18px 12px 0;
            border-top: 1px solid var(--line);
            text-align: center;
            font-family: var(--font);
            font-variant-numeric: tabular-nums;
            font-size: 10px;
            letter-spacing: .08em;
            color: var(--ink-faint);
        }

        .noscript-note {
            margin: 20px;
            padding: 20px;
            font-size: 13px;
            color: var(--amber);
        }

        @media (max-width: 1000px) {
            .left-col {
                display: contents;
            }

            .c-filter {
                order: 1;
                grid-column: span 12;
            }

            .c-timeline {
                order: 2;
                grid-column: span 12;
            }

            .c-chart {
                order: 3;
                grid-column: span 12;
            }

            .cal-week {
                display: flex;
                overflow-x: auto;
                padding-bottom: 6px;
            }

            .cal-day {
                flex: 0 0 172px;
            }
        }

        @media (max-width: 860px) {
            :root {
                --nav-h: 106px;
            }

            .nav-inner {
                flex-wrap: wrap;
                gap: 8px 14px;
            }

            .nav-links {
                order: 3;
                flex-basis: 100%;
            }

            .nav-ctrl {
                margin-left: auto;
            }
        }

        @media (max-width: 720px) {
            .card {
                padding: 18px;
            }

            .c-timeline {
                padding: 18px 14px 6px;
            }

            .timeline-items {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            }

            .year-label {
                font-size: 21px;
            }

            .carousel-caption {
                padding: 12px 14px 14px;
            }

            .carousel-name {
                font-size: 14px;
            }

            .cal-header {
                align-items: flex-start;
            }
        }

        @media (max-width: 560px) {
            .timeline-items {
                grid-template-columns: repeat(2, 1fr);
            }

            .nav-btn {
                width: 40px;
                height: 40px;
            }

            .nav-inner {
                gap: 8px 10px;
            }

            .cal-week {
                flex-direction: column;
                overflow-x: visible;
            }

            .cal-day {
                flex: none;
                min-height: auto;
            }

            .cal-day-head {
                height: 84px;
            }

            .carousel-arrow {
                width: 32px;
                height: 32px;
            }

            .carousel-arrow.prev {
                left: 6px;
            }

            .carousel-arrow.next {
                right: 6px;
            }

            .cal-controls {
                width: 100%;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation: none !important;
                transition: none !important;
            }

            html {
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>

<body>
    <div class="fog" aria-hidden="true"><span class="fog-a"></span><span class="fog-b"></span></div>

    <header class="navbar">
        <div class="nav-inner">
            <a class="brand" href="https://skmst.netlify.app" target="_blank"><span
                    class="brand-name">skmst-db</span></a>
            <nav class="nav-links" aria-label="サイトナビゲーション">
            </nav>
            <div class="nav-ctrl">
                <button type="button" class="nav-btn" id="theme-toggle" aria-label="ライトモードに切り替え"><span class="nav-glyph"
                        aria-hidden="true">◑</span></button>
                <button type="button" class="nav-btn" id="btn-top" aria-label="ページ最上部へ戻る"><span class="nav-glyph"
                        aria-hidden="true">▲</span></button>
                <button type="button" class="nav-btn" id="btn-end" aria-label="ページ最下部へ移動"><span class="nav-glyph"
                        aria-hidden="true">▼</span></button>
            </div>
        </div>
    </header>

    <noscript>
        <div class="card noscript-note">このページの年表・フィルターは JavaScript で動作します。JavaScript を有効にしてください。</div>
    </noscript>

    <main class="main">
        <h1 class="sr-only">WORKS — 堺雅人 出演作品年表</h1>
        <span class="sr-only" role="status" id="a11y-status">作品データを読み込み中…</span>

        <div class="stack">
            <section class="card c-carousel" aria-label="ピックアップ">
                <div class="carousel" id="carousel">
                    <div class="carousel-track-wrap">
                        <div class="carousel-track" id="carousel-track"></div>
                    </div>
                    <div class="carousel-nav">
                        <button type="button" class="carousel-arrow prev" id="carousel-prev"
                            aria-label="前のスライド">◀</button>
                        <div class="carousel-dots" id="carousel-dots"></div>
                        <button type="button" class="carousel-arrow next" id="carousel-next"
                            aria-label="次のスライド">▶</button>
                    </div>
                </div>
            </section>

            <section class="card c-calendar" aria-label="カレンダー">
                <div class="cal-header">
                    <div class="cal-title" id="cal-title"></div>
                    <div class="cal-controls">
                        <div class="cal-selects">
                            <select id="cal-year" aria-label="年"></select>
                            <select id="cal-month" aria-label="月"></select>
                            <select id="cal-day" aria-label="日"></select>
                        </div>
                        <div class="cal-nav">
                            <button type="button" class="cal-step" id="cal-prev" aria-label="前の週">◀</button>
                            <button type="button" id="cal-today">Today</button>
                            <button type="button" class="cal-step" id="cal-next" aria-label="次の週">▶</button>
                        </div>
                    </div>
                </div>
                <div class="cal-week" id="cal-week"></div>

                <div class="heat-scroll">
                    <div class="heat" aria-label="アクティビティヒートマップ">
                        <div class="heat-side" id="heat-side"></div>
                        <div class="heat-main">
                            <div class="heat-months" id="heat-months"></div>
                            <div class="heat-grid" id="heat-grid"></div>
                        </div>
                    </div>
                </div>
            </section>

            <div class="bento">
                <div class="left-col">
                    <section class="card c-filter" aria-label="絞り込み">
                        <div class="filter-buttons">
                            <button type="button" class="filter-btn active" data-filter="all">全て</button>
                            <button type="button" class="filter-btn" data-filter="映画">映画</button>
                            <button type="button" class="filter-btn" data-filter="TV">TV</button>
                            <button type="button" class="filter-btn" data-filter="舞台">舞台</button>
                            <button type="button" class="filter-btn" data-filter="その他">その他</button>
                            <button type="button" class="filter-btn" data-filter="声の出演">声の出演</button>
                            <button type="button" class="filter-btn" data-filter="BOOK">BOOK</button>
                        </div>

    <script>
        document.addEventListener('DOMContentLoaded', async function () {
            const motionOK = () => !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            const THEME_KEY = 'skmst-theme';

            (function highlightCurrentPage() {
                const normalize = (p) => !p ? '' : p.split('/').pop().split('?')[0].split('#')[0].replace(/\.html$/, '');
                const current = normalize(window.location.pathname) || 'works';
                document.querySelectorAll('.nav-links a').forEach(link => {
                    const target = normalize(link.getAttribute('href'));
                    if (current === target || ((current === 'about' || current === 'contact') && target === 'about')) {
                        link.classList.add('active'); link.setAttribute('aria-current', 'page');
                    } else { link.classList.remove('active'); link.removeAttribute('aria-current'); }
                });
            })();

            const themeBtn = document.getElementById('theme-toggle');
            const metaTheme = document.querySelector('meta[name="theme-color"]');
            function renderTheme(t) {
                document.documentElement.setAttribute('data-theme', t);
                const dark = t === 'dark';
                themeBtn.setAttribute('aria-label', dark ? 'ライトモードに切り替え' : 'ダークモードに切り替え');
                if (metaTheme) metaTheme.setAttribute('content', dark ? '#131311' : '#F2F0EA');
            }
            renderTheme(document.documentElement.getAttribute('data-theme') || 'dark');
            themeBtn.addEventListener('click', () => {
                const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                try { localStorage.setItem(THEME_KEY, next); } catch (e) { }
                renderTheme(next);
            });
            window.addEventListener('storage', (e) => {
                if (e.key === THEME_KEY && (e.newValue === 'light' || e.newValue === 'dark')) renderTheme(e.newValue);
            });
            document.getElementById('btn-top').addEventListener('click', () => window.scrollTo({ top: 0, behavior: motionOK() ? 'smooth' : 'auto' }));
            document.getElementById('btn-end').addEventListener('click', () => window.scrollTo({ top: document.documentElement.scrollHeight, behavior: motionOK() ? 'smooth' : 'auto' }));

            /* ================= Carousel ================= */
            const SLIDES = [
                {
                    name: 'PARCO PRODUCE 舞台『スリーゴースト』',
                    info: '2026年10月 PARCO劇場<br>2026年11-12月 全国ツアー（大阪、福岡、愛知、岡山、宮崎）',
                    url: 'https://stage.parco.jp/program/threeghosts/',
                    youtube: 'https://www.youtube.com/watch?v=QNPMGnr6kKQ&t'
                },
                {
                    name: '映画『南極料理人 4Kリマスター』',
                    info: '🍜2026年11月13日(金)公開🍜',
                    url: 'https://www.theatres.co.jp/service/distribution/nankyoku-ryori/',
                    youtube: 'https://www.youtube.com/watch?v=GlwxXzX1SdI'
                },
                {
                    name: '映画『VIVANT』',
                    info: '2026年12月4日(金) IN THEATER IMAX同時公開',
                    url: 'https://vivant.toho-movie.jp/',
                    youtube: 'https://www.youtube.com/watch?v=cYEH0XDhWDw'
                },
                {
                    name: '「第77回 NHK紅白歌合戦」 🟥司会⬜️',
                    info: '📅2026年12月31日 (木) 19:20~23:45',
                    url: 'https://www.nhk.or.jp/kouhaku/mc77/mc_1.html',
                    youtube: 'https://www.youtube.com/watch?v=YtDk_wx1oZo'
                },
                {
                    name: 'VIVANT 第2シーズン Blu-ray&DVD📀',
                    info: '2027年3月3日(水) 発売',
                    url: 'https://sp.tc-ent.co.jp/vivant_link/'
                }
            ];

            function getYouTubeEmbedUrl(url) {
                if (!url) return null;
                const match = url.match(/(?:youtube\.com\/(?:watch\?.*v=|embed\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/i);
                return match ? `https://www.youtube-nocookie.com/embed/${match[1]}?enablejsapi=1` : null;
            }

            (function initCarousel() {
                const track = document.getElementById('carousel-track');
                const dotsWrap = document.getElementById('carousel-dots');
                const carousel = document.getElementById('carousel');
                if (!track) return;
                const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                let idx = 0, timer = null;
                const totalReal = SLIDES.length;

                function getVisibleCount() {
                    if (window.innerWidth <= 600) return 1;
                    if (window.innerWidth <= 960) return 2;
                    return 3;
                }

                // 构建一张卡片的 DOM
                function buildSlide(s) {
                    const slide = document.createElement('div');
                    slide.className = 'carousel-slide';
                    slide.tabIndex = 0;
                    slide.setAttribute('role', 'group');
                    slide.setAttribute('aria-label', s.name);

                    slide.addEventListener('click', (e) => {
                        if (e.target.closest('.carousel-media-wrap') || e.target.tagName === 'IFRAME') return;
                        if (s.url && s.url !== '#') window.open(s.url, '_blank', 'noopener');
                    });

                    const mediaWrap = document.createElement('div');
                    mediaWrap.className = 'carousel-media-wrap';
                    const embedUrl = getYouTubeEmbedUrl(s.youtube);
                    if (embedUrl) {
                        const iframe = document.createElement('iframe');
                        iframe.src = embedUrl;
                        iframe.title = s.name;
                        iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
                        iframe.allowFullscreen = true;
                        mediaWrap.appendChild(iframe);
                    } else {
                        const placeholder = document.createElement('div');
                        placeholder.className = 'carousel-media-placeholder';
                        const pName = document.createElement('div');
                        pName.className = 'carousel-placeholder-name';
                        pName.textContent = s.name;
                        const pInfo = document.createElement('div');
                        pInfo.className = 'carousel-placeholder-info';
                        pInfo.innerHTML = s.info;
                        placeholder.appendChild(pName);
                        placeholder.appendChild(pInfo);
                        mediaWrap.appendChild(placeholder);
                    }
                    slide.appendChild(mediaWrap);

                    const caption = document.createElement('div');
                    caption.className = 'carousel-caption';
                    const name = document.createElement('div');
                    name.className = 'carousel-name';
                    name.textContent = s.name;
                    name.title = s.name;
                    const info = document.createElement('div');
                    info.className = 'carousel-info';
                    info.innerHTML = s.info;
                    caption.appendChild(name);
                    caption.appendChild(info);
                    slide.appendChild(caption);

                    return slide;
                }

                // 渲染：原始卡片 + 尾部追加一组克隆，实现无限循环
                SLIDES.forEach(s => track.appendChild(buildSlide(s)));
                SLIDES.forEach(s => track.appendChild(buildSlide(s)));

                function getCardStep() {
                    const firstCard = track.children[0];
                    if (!firstCard) return 0;
                    return firstCard.getBoundingClientRect().width + 14; // 14 = gap
                }

                function setPosition(animate) {
                    if (!animate) {
                        track.style.transition = 'none';
                    } else {
                        track.style.transition = 'transform .45s var(--ease)';
                    }
                    const offset = idx * getCardStep();
                    track.style.transform = `translateX(-${offset}px)`;
                    if (!animate) {
                        // 强制回流使 transition:none 立即生效
                        track.offsetHeight;
                    }
                    updateDots();
                }

                // 当滑过所有真实卡片后，瞬移回对应的真实位置
                track.addEventListener('transitionend', () => {
                    if (idx >= totalReal) {
                        idx = idx - totalReal;
                        setPosition(false);
                    }
                });

                function buildDots() {
                    dotsWrap.innerHTML = '';
                    for (let i = 0; i < totalReal; i++) {
                        const dot = document.createElement('button');
                        dot.type = 'button';
                        dot.className = 'carousel-dot' + (i === (idx % totalReal) ? ' active' : '');
                        dot.setAttribute('aria-label', `スライド ${i + 1}`);
                        dot.addEventListener('click', () => { idx = i; setPosition(true); start(); });
                        dotsWrap.appendChild(dot);
                    }
                }

                function updateDots() {
                    const realIdx = idx % totalReal;
                    const dots = Array.from(dotsWrap.children);
                    dots.forEach((d, i) => d.classList.toggle('active', i === realIdx));
                }

                function goNext() {
                    idx++;
                    setPosition(true);
                }

                function goPrev() {
                    if (idx <= 0) {
                        // 先瞬移到克隆区的对应位置，再动画回退一步
                        idx = totalReal;
                        setPosition(false);
                        requestAnimationFrame(() => {
                            idx = totalReal - 1;
                            setPosition(true);
                        });
                    } else {
                        idx--;
                        setPosition(true);
                    }
                }

                function stop() { if (timer) { clearInterval(timer); timer = null; } }
                function start() { stop(); if (!reduce) timer = setInterval(goNext, 8000); }

                document.getElementById('carousel-next').addEventListener('click', () => { goNext(); start(); });
                document.getElementById('carousel-prev').addEventListener('click', () => { goPrev(); start(); });

                carousel.addEventListener('mouseenter', stop);
                carousel.addEventListener('mouseleave', start);
                carousel.addEventListener('focusin', stop);
                carousel.addEventListener('focusout', start);

                window.addEventListener('resize', () => {
                    buildDots();
                    setPosition(false);
                });

                buildDots();
                requestAnimationFrame(() => setPosition(false));
                start();
            })();

            /* ================= Calendar: anniversary week view + heatmap ================= */
            const special_memo = [
                { name: '乃木憂助の誕生日', month: 0, day: 25, startYear: 2024, url: 'https://h2col.notion.site/1b68a08476c780e78f0fe8e8e8441e1b' },
                { name: '伊達一義の誕生日', month: 5, day: 29, startYear: 2011, url: 'https://h2col.notion.site/1b68a08476c780caa667e03f4ffdffb8' },
                { name: '木村一樹の誕生日', month: 9, day: 11, startYear: 2008, url: 'https://h2col.notion.site/1b68a08476c78015ab14f23054250d11' },
                { name: '半沢直樹の誕生日', month: 11, day: 8, startYear: 2013, url: 'https://h2col.notion.site/1b68a08476c7804dba68d1ae0ae9e9cc' }
            ];
            function calculateSakaiMilestones(year, month) {
                const milestones = [];
                const startDate = createJSTDate(SAKAI_BIRTH.year, SAKAI_BIRTH.month, SAKAI_BIRTH.day);
                const lastDay = new Date(Date.UTC(year, month + 1, 0)).getUTCDate();
                for (let d = 1; d <= lastDay; d++) {
                    const cur = createJSTDate(year, month, d);
                    const dayCount = Math.floor((cur.getTime() - startDate.getTime()) / (1000 * 60 * 60 * 24)) + 1;
                    if (dayCount > 0 && dayCount % 100 === 0) {
                        milestones.push({ startDate: cur, endDate: cur, title: `${dayCount}th`, url: 'https://sakai-masato.com/', source: 'sakai-milestone' });
                    }
                }
                return milestones;
            }
            function formatAnniversaryEvent(event) {
                if (event.source !== 'anniversary') return event;
                let title = event.originalTitle || '';
                const color = (event.role === '主演') ? '#5474a1' : '#889063';
                if (event.anniversaryType === 'start') title += ` 【${event.diffValue}周年】`;
                else if (event.anniversaryType === 'end') title += ` 【終了-${event.diffValue}周年】`;
                else if (event.anniversaryType === 'days_start') title += ` 【${event.diffValue}日前】`;
                else if (event.anniversaryType === 'days_end') title += ` 【終了-${event.diffValue}日前】`;
                return { ...event, title, color };
            }
            function sourceColor(ev) {
                switch (ev.source) {
                    case 'main': return { bg: 'rgba(52, 152, 219, 0.8)', text: '#ffffff' };
                    case 'other': return { bg: 'rgba(241, 196, 15, 0.8)', text: '#26241F' };
                    case 'sakai-birthday':
                    case 'sakai-milestone': return { bg: 'rgba(46, 204, 113, 0.8)', text: '#ffffff' };
                    case 'special_memo': return { bg: '#43AA8B', text: '#ffffff' };
                    case 'anniversary': return { bg: ev.color || '#889063', text: '#ffffff' };
                    case 'syukujitsu': return { bg: '#FFD1D1', text: '#c0392b' };
                    default: return { bg: 'rgba(52, 152, 219, 0.8)', text: '#ffffff' };
                }
            }
            async function fetchDayRows() {
                try {
                    const res = await fetch('/data/day.csv');
                    const text = await res.text();
                    const lines = text.split('\n').filter(l => l.trim());
                    if (lines.length < 2) return [];
                    const header = parseCSVRow(lines[0]);
                    return lines.slice(1).map(line => {
                        const cols = parseCSVRow(line);
                        const o = {};
                        header.forEach((h, i) => { o[h] = (cols[i] || '').trim(); });
                        return o;
                    });
                } catch (e) { console.error('day.csv error:', e); return []; }
            }
            (async function initCalendar() {
                const weekEl = document.getElementById('cal-week');
                const titleEl = document.getElementById('cal-title');
                const yearSel = document.getElementById('cal-year');
                const monthSel = document.getElementById('cal-month');
                const daySel = document.getElementById('cal-day');
                const heatSide = document.getElementById('heat-side');
                const heatMonths = document.getElementById('heat-months');
                const heatGrid = document.getElementById('heat-grid');
                if (!weekEl) return;
                let bio = [], holidays = [], otherEvents = [], dayRows = [];
                try {
                    [bio, holidays, otherEvents, dayRows] = await Promise.all([
                        fetchBiographyCSV(),
                        parseSyukujitsuCSV(),
                        parseOtherCSV(),
                        fetchDayRows()
                    ]);
                } catch (e) { console.error('Calendar data error:', e); }

                const dayMap = new Map();
                dayRows.forEach(row => {
                    const mmdd = (row.day || '').trim();
                    if (!/^\d{4}$/.test(mmdd)) return;
                    const M = parseInt(mmdd.slice(0, 2), 10) - 1;
                    const D = parseInt(mmdd.slice(2), 10);
                    if (M < 0 || M > 11 || D < 1 || D > 31) return;
                    const url = row.url || '';
                    (row.year || '').split(',').forEach(y => {
                        const Y = parseInt(y.trim(), 10);
                        if (!Number.isFinite(Y) || Y <= 0) return;
                        const key = `${Y}-${M}-${D}`;
                        if (!dayMap.has(key)) dayMap.set(key, url);
                    });
                });

                const annCache = new Map(), mileCache = new Map();
                const midnight = (d) => createJSTDate(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
                const mondayOf = (d) => { const m = midnight(d); const dow = m.getUTCDay(); const diff = (dow === 0 ? 6 : dow - 1); return createJSTDate(m.getUTCFullYear(), m.getUTCMonth(), m.getUTCDate() - diff); };
                const daysInMonth = (Y, M) => new Date(Date.UTC(Y, M + 1, 0)).getUTCDate();
                let selectedDate = getJSTMidnight();
                let weekStart = midnight(selectedDate);
                let heatYear = selectedDate.getUTCFullYear();

                const getAnn = (Y, M) => { const k = Y + '-' + M; if (!annCache.has(k)) annCache.set(k, calculateAnniversaries(bio, Y, M).map(formatAnniversaryEvent)); return annCache.get(k); };
                const getMile = (Y, M) => { const k = Y + '-' + M; if (!mileCache.has(k)) mileCache.set(k, calculateSakaiMilestones(Y, M)); return mileCache.get(k); };
                function eventsForDay(d) {
                    const Y = d.getUTCFullYear(), M = d.getUTCMonth(), D = d.getUTCDate();
                    const out = [];
                    bio.forEach(e => { if (isEventActiveOnDate(e, d)) out.push({ title: e.title || e.name, url: e.url, source: 'main' }); });
                    otherEvents.forEach(e => { if (isSameJSTDay(e.startDate, d)) out.push({ title: e.title, url: e.url, source: 'other' }); });
                    getMile(Y, M).forEach(m => { if (isSameJSTDay(m.startDate, d)) out.push({ title: m.title, url: m.url, source: 'sakai-milestone' }); });
                    special_memo.forEach(b => { if (Y >= b.startYear && b.month === M && b.day === D) out.push({ title: b.name, url: b.url, source: 'special_memo' }); });
                    if (M === SAKAI_BIRTH.month && D === SAKAI_BIRTH.day) out.push({ title: '堺さんの誕生日 🎂', url: 'https://sakai-masato.com/', source: 'sakai-birthday' });
                    getAnn(Y, M).forEach(a => { if (isSameJSTDay(a.startDate, d)) out.push({ title: a.title, url: a.url, source: 'anniversary', color: a.color }); });
                    return out;
                }
                function rangeLabel(a, b) {
                    const ay = a.getUTCFullYear(), by = b.getUTCFullYear(), am = a.getUTCMonth() + 1, bm = b.getUTCMonth() + 1;
                    if (ay === by && am === bm) return `${ay}年${am}月${a.getUTCDate()}日 – ${b.getUTCDate()}日`;
                    if (ay === by) return `${ay}年${am}月${a.getUTCDate()}日 – ${bm}月${b.getUTCDate()}日`;
                    return `${ay}年${am}月${a.getUTCDate()}日 – ${by}年${bm}月${b.getUTCDate()}日`;
                }
                function buildDays() {
                    const Y = parseInt(yearSel.value, 10), M = parseInt(monthSel.value, 10);
                    const dim = daysInMonth(Y, M);
                    const prev = parseInt(daySel.value, 10) || 1;
                    daySel.innerHTML = '';
                    for (let d = 1; d <= dim; d++) { const o = document.createElement('option'); o.value = d; o.textContent = d + '日'; daySel.appendChild(o); }
                    daySel.value = Math.min(prev, dim);
                }
                function syncSelectors() {
                    yearSel.value = selectedDate.getUTCFullYear();
                    monthSel.value = selectedDate.getUTCMonth();
                    buildDays();
                    daySel.value = selectedDate.getUTCDate();
                }
                function buildSelectors() {
                    const cy = getJSTYear();
                    yearSel.innerHTML = '';
                    for (let y = cy + 3; y >= 1992; y--) { const o = document.createElement('option'); o.value = y; o.textContent = y + '年'; yearSel.appendChild(o); }
                    monthSel.innerHTML = '';
                    for (let m = 0; m < 12; m++) { const o = document.createElement('option'); o.value = m; o.textContent = (m + 1) + '月'; monthSel.appendChild(o); }
                    syncSelectors();
                }
                function setSelected(date) {
                    selectedDate = midnight(date);
                    weekStart = midnight(date);
                    syncSelectors();
                    render();
                    const ny = selectedDate.getUTCFullYear();
                    if (ny !== heatYear) { heatYear = ny; renderHeatmap(ny); }
                }
                function render() {
                    const days = Array.from({ length: 7 }, (_, i) => createJSTDate(weekStart.getUTCFullYear(), weekStart.getUTCMonth(), weekStart.getUTCDate() + i));
                    const today = getJSTMidnight();
                    titleEl.textContent = rangeLabel(days[0], days[6]);
                    weekEl.innerHTML = '';
                    const wd = ['日', '月', '火', '水', '木', '金', '土'];
                    days.forEach((d, i) => {

            function hasUwasaFlag(noteText) { return /(^|[\s,;|])uwasa($|[\s,;|])/i.test(noteText || ''); }

            function extractYearFromNote(noteText) {
                if (!noteText) return 0;
                const normalized = noteText.replace(/[０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
                const matches = normalized.match(/(?:19|20)\d{2}/g);
                if (!matches || matches.length === 0) return 0;
                return Math.max(...matches.map(y => parseInt(y, 10)));
            }
            async function loadData() {

                        const dateStart = parseJSTDate((row.DateStart || '').trim());
                        let year = 0;
                        if (dateStart) year = dateStart.getUTCFullYear();
                        else { const nt = row.Note || ''; if (nt && !hasUwasaFlag(nt)) year = extractYearFromNote(nt); }
                        const dateEnd = parseJSTDate((row.DateEnd || '').trim());
                        let effEnd = (dateEnd && dateStart && dateEnd > dateStart) ? dateEnd : null;
                        (row.DateAdd || '').split(',').forEach(s => {
                            const d = parseJSTDate(s.trim());
                            if (d && !isNaN(d.getTime()) && dateStart && d >= dateStart && (!effEnd || d > effEnd)) effEnd = d;
                        });

            async function generateTimeline(works) {

                    const awardMap = new Map();
                    works.forEach(work => {

                        awards.forEach(aName => {
                            if (!awardMap.has(aName)) awardMap.set(aName, []);
                            if (!awardMap.get(aName).includes(work)) {
                                awardMap.get(aName).push(work);
                            }
                        });
                    });

                    const awardGroups = [];
                    awardMap.forEach((aWorks, aName) => {
                        // 组内作品按照 dateStart 升序
                        const sWorks = [...aWorks].sort((a, b) => {
                            const ta = getWorkTimestamp(a);
                            const tb = getWorkTimestamp(b);
                            if (ta !== tb) return ta - tb;
                            return (a.year || 0) - (b.year || 0);
                        });
                        const dStr = awardDateMap.get(aName) || '';
                        let dTime = 0;
                        if (dStr) {
                            const parsed = parseJSTDate(dStr);
                            if (parsed) dTime = parsed.getTime();
                        }
                        awardGroups.push({
                            name: aName,
                            date: dStr,
                            timestamp: dTime,
                            works: sWorks
                        });
                    });

                    // 奖项组别排序参照 AWARDS_REGISTRY 中的 date 降序
                    awardGroups.sort((a, b) => {
                        if (b.timestamp !== a.timestamp) return b.timestamp - a.timestamp;
                        return b.date.localeCompare(a.date);
                    });

                    const awardSectionsData = awardGroups.map(grp => ({
                        label: grp.name,
                        works: grp.works
                    }));
                    await renderTimelineProgressively(awardSectionsData, timelineContainer);
                } else if (isSeriesMode) {
                    const seriesMap = new Map();
                    works.forEach(work => {
                        const sName = work._series;
                        if (!sName || !seriesNamesSet.has(sName)) return;
                        if (!seriesMap.has(sName)) seriesMap.set(sName, []);
                        seriesMap.get(sName).push(work);
                    });
                    const seriesGroups = [];
                    seriesMap.forEach((sWorks, sName) => {
                        sWorks.sort((a, b) => {
                            const ta = getWorkTimestamp(a);
                            const tb = getWorkTimestamp(b);
                            if (ta !== tb) return ta - tb;
                            return (a.year || 0) - (b.year || 0);
                        });
                        const firstTime = sWorks.length > 0 ? getWorkTimestamp(sWorks[0]) : 0;
                        seriesGroups.push({ name: sName, firstTime, works: sWorks });
                    });
                    seriesGroups.sort((a, b) => b.firstTime - a.firstTime);
                    const seriesSectionsData = seriesGroups.map(grp => ({ label: grp.name, works: grp.works }));

                itemDiv.tabIndex = 0; itemDiv.setAttribute('role', 'link');
                itemDiv.setAttribute('aria-label', `${work.title || work.name}${work.name && work.title ? '／' + work.name : ''}（${work.year}）— リンクを新しいタブで開く`);
                itemDiv.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); itemDiv.click(); } });
                function renderFallback() {
                    itemDiv.innerHTML = '';
                    const center = document.createElement('div'); center.className = 'tile-center';
                    const titleDiv = document.createElement('div'); titleDiv.className = 'work-title'; titleDiv.textContent = work.title || work.name;
                    center.appendChild(titleDiv);
                    const hasName = !!(work.name && work.title);
                    const isUpcoming = work.dateStart && work.dateStart.getTime() > today.getTime();
                    const isOngoing = work.dateStart && work.effEnd && work.dateStart.getTime() <= today.getTime() && today.getTime() <= work.effEnd.getTime();
                    if (hasName || isUpcoming || isOngoing) {
                        const sub = document.createElement('div'); sub.className = 'tile-sub';
                        if (hasName) { const ns = document.createElement('span'); ns.className = 'work-name'; ns.textContent = work.name; sub.appendChild(ns); }
                        if (isUpcoming) { const b = document.createElement('span'); b.className = 'badge badge-soon'; b.innerHTML = '<i></i>upcoming'; sub.appendChild(b); }
                        else if (isOngoing) { const b = document.createElement('span'); b.className = 'badge badge-live'; b.innerHTML = '<i></i>running'; sub.appendChild(b); }
                        center.appendChild(sub);
                    }
                    itemDiv.appendChild(center);
                    const meta = document.createElement('div'); meta.className = 'tile-meta';
                    if (isLead) { const lead = document.createElement('span'); lead.className = 'chip chip-lead'; lead.textContent = '主演'; meta.appendChild(lead); }
                    if (work.type) { const type = document.createElement('span'); type.className = 'chip'; type.textContent = work.type; meta.appendChild(type); }
                    const date = document.createElement('span'); date.className = 'tile-date mono'; date.textContent = formatWorkRange(work); meta.appendChild(date);
                    itemDiv.appendChild(meta);
                }

                if (work.poster) {
                    itemDiv.classList.add('has-poster');
                    const img = document.createElement('img');
                    img.className = 'work-poster';
                    img.src = work.poster;
                    img.alt = work.title || work.name;
                    img.loading = 'lazy';
                    img.onerror = () => {
                        itemDiv.classList.remove('has-poster');
                        renderFallback();
                    };
                    itemDiv.appendChild(img);
                } else {
                    renderFallback();
                }
                return itemDiv;
            }
            function createYearSection(yearData) {
                const { year, label, works } = yearData;
                const title = label !== undefined ? label : year;
                const today = getJSTMidnight();
                const currentYear = getJSTNow().getUTCFullYear();
                const yearDiv = document.createElement('div');
                yearDiv.className = 'timeline-year';
                if (year !== undefined) yearDiv.id = 'y' + year;
                if (typeof year === 'number' && year === currentYear) yearDiv.classList.add('year-now');
                const head = document.createElement('div'); head.className = 'year-head';
                const yearLabel = document.createElement('div'); yearLabel.className = 'year-label'; yearLabel.textContent = title;
                head.appendChild(yearLabel);
                const rule = document.createElement('span'); rule.className = 'year-rule'; head.appendChild(rule);
                yearDiv.appendChild(head);
                const itemsDiv = document.createElement('div'); itemsDiv.className = 'timeline-items';
                if (works && works.length > 0) {
                    works.forEach((work, index) => {
                        itemsDiv.appendChild(createWorkCard(work, index, today));
                    });
                }
                yearDiv.appendChild(itemsDiv);
                return yearDiv;
            }
            function renderFlatTimelineProgressively(works, container) {
                return new Promise((resolve) => {
                    const itemsDiv = document.createElement('div');
                    itemsDiv.className = 'timeline-items';
                    container.appendChild(itemsDiv);
                    const today = getJSTMidnight();
                    const BATCH_SIZE = 24;
                    let currentIndex = 0;
                    function renderBatch() {
                        const endIndex = Math.min(currentIndex + BATCH_SIZE, works.length);
                        for (let i = currentIndex; i < endIndex; i++) {
                            itemsDiv.appendChild(createWorkCard(works[i], i, today));
                        }
                        currentIndex = endIndex;
                        if (currentIndex < works.length) requestAnimationFrame(renderBatch);
                        else resolve();
                    }
                    renderBatch();
                });
            }
            function formatWorkRange(work) {
                if (!work.dateStart) return '日付不明';
                const s = formatDate(work.dateStart);
                if (work.effEnd) {
                    const e = work.effEnd;
                    const sameYear = e.getUTCFullYear() === work.dateStart.getUTCFullYear();
                    const endStr = sameYear ? `${String(e.getUTCMonth() + 1).padStart(2, '0')}/${String(e.getUTCDate()).padStart(2, '0')}` : formatDate(e);
                    return `${s} – ${endStr}`;
                }
                return s;
            }
            function renderTimelineProgressively(yearSectionsData, container) {
                return new Promise((resolve) => {
                    const BATCH_SIZE = 3;
                    let currentIndex = 0;
                    function renderBatch() {
                        const endIndex = Math.min(currentIndex + BATCH_SIZE, yearSectionsData.length);
                        for (let i = currentIndex; i < endIndex; i++) container.appendChild(createYearSection(yearSectionsData[i]));
                        currentIndex = endIndex;
                        if (currentIndex < yearSectionsData.length) requestAnimationFrame(renderBatch);
                        else resolve();
                    }
                    renderBatch();
                });
            }
            function renderChart(works) {
                const total = works.length;
                const lead = works.filter(w => w.role && w.role.includes('主演')).length;
                const award = works.filter(w => w.award && w.award.trim() !== '').length;
                const statValues = { total, lead, award };
                const typeCounts = {};
                document.querySelectorAll('.chart-row[data-type]').forEach(r => { typeCounts[r.dataset.type] = 0; });
                works.forEach(w => { if (w.type in typeCounts) typeCounts[w.type]++; });
                const denom = Math.max(1, total);
                document.querySelectorAll('.chart-row').forEach(r => {
                    const value = r.dataset.stat ? (statValues[r.dataset.stat] || 0) : (typeCounts[r.dataset.type] || 0);
                    r.querySelector('.chart-fill').style.width = (value / denom * 100) + '%';
                    r.querySelector('.chart-num').textContent = value;
                });

                // Decade chart
                const decadeContainer = document.getElementById('chart-decade-rows');
                if (!decadeContainer) return;
                decadeContainer.innerHTML = '';
                const currentYear = getJSTNow().getUTCFullYear();
                const currentDecade = Math.floor(currentYear / 10) * 10;
                const decades = [];
                for (let d = currentDecade; d >= 1990; d -= 10) decades.push(d);
                const decadeCounts = {};
                decades.forEach(d => { decadeCounts[d] = 0; });
                works.forEach(w => {
                    const d = Math.floor(w.year / 10) * 10;
                    if (d in decadeCounts) decadeCounts[d]++;
                });
                const decadeMax = Math.max(1, ...Object.values(decadeCounts));
                decades.forEach(d => {
                    const count = decadeCounts[d];
                    const row = document.createElement('div');
                    row.className = 'chart-row';
                    const label = document.createElement('span');
                    label.className = 'chart-label mono';
                    label.textContent = d + 's';
                    const track = document.createElement('span');
                    track.className = 'chart-track';
                    const fill = document.createElement('span');
                    fill.className = 'chart-fill';
                    fill.style.setProperty('--c', 'var(--teal)');
                    fill.style.width = (count / decadeMax * 100) + '%';
                    track.appendChild(fill);
                    const num = document.createElement('span');
                    num.className = 'chart-num mono';
                    num.textContent = count;
                    row.appendChild(label);
                    row.appendChild(track);
                    row.appendChild(num);
                    decadeContainer.appendChild(row);
                });
            }
        });
    </script>
</body>
